name: Auto Update IPTV Playlist

on:
  schedule:
    # ตั้งเวลาให้รันอัตโนมัติทุกๆ 2 ชั่วโมง
    - cron: '0 */2 * * *'
  # ปุ่มสำหรับกดสั่งรันทดสอบด้วยมือ
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run updater script
        run: python update_playlist.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          # สั่งให้ Git สนใจเฉพาะไฟล์ IPTV-Marco.m3u เท่านั้น
          git add IPTV-Marco.m3u
          git diff --quiet IPTV-Marco.m3u || (git commit -m "Auto-update cy-102 link" && git push)
