name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout only workflow and script (Clean run)
        uses: actions/checkout@v4
        with:
          # ดึงมาแค่ไฟล์ .yml และสคริปต์ Python เท่านั้น จะได้ไม่ไปโดนโฟลเดอร์รูปภาพ
          sparse-checkout: |
            .github/workflows/update.yml
            update_playlist.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run updater script
        run: python update_playlist.py

      - name: Commit and push IPTV-Marco.m3u
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add IPTV-Marco.m3u
          git commit -m "Auto-update cy-102 link" || echo "No changes to commit"
          git push
