name: Auto Update IPTV Playlist

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository completely
        uses: actions/checkout@v4
        with:
          # ปิดการใช้งานตัวตรวจสอบชื่อไฟล์ยาวของ git บน Linux ชั่วคราว
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Configure Git to ignore long paths
        run: |
          git config --global core.longpaths true

      - name: Run updater script
        run: python update_playlist.py

      - name: Commit and push IPTV-Marco.m3u
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add IPTV-Marco.m3u
          git diff --quiet IPTV-Marco.m3u || (git commit -m "Auto-update cy-102 link" && git push)
