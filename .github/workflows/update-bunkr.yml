
name: Update Bunkr M3U links

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bunkr-m3u
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout required files only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /IPTV-Marco.m3u
            /bunkr_sources.json
            /update_bunkr_m3u.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Bunkr URLs
        run: python update_bunkr_m3u.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add IPTV-Marco.m3u
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Bunkr M3U URLs"
            git push
          else
            echo "No changes to commit"
          fi
